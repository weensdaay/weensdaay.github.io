name: Public statistics
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-statistics.yml'
      - 'stats/**'
      - 'scripts/*stats*'
      - 'scripts/public-parsers.mjs'
      - 'src/stats*'
      - 'tests/stats.test.mjs'
permissions: {}
concurrency:
  group: public-statistics
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'weensdaay/weensdaay.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/stats.test.mjs
      - run: node scripts/collect-stats.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-statistics
          path: .stats-output/*.json
          retention-days: 2
          include-hidden-files: true
          if-no-files-found: error
  publish:
    needs: collect
    if: github.repository == 'weensdaay/weensdaay.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-statistics
          path: .stats-output
      - run: node scripts/publish-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
